<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>참둥이의 마을 유형 찾기</title>
    <link rel="stylesheet" href="style.css?v=20260817-3" />
  </head>
  <body>
    <main class="page">
      <section class="survey-box">
        <header class="survey-header">
          <div class="scene-banner" aria-hidden="true"></div>
          <div class="title-block">
            <p class="eyebrow">village type test</p>
            <h1>참둥이의 마을 유형 찾기</h1>
            <p>답변을 선택하면 다음 질문으로 넘어갑니다.</p>
          </div>
        </header>

        <section id="question-view">
          <div class="progress-line">
            <span id="progress-text">Q1 / Q6</span>
            <div class="progress-track">
              <div id="progress-bar" class="progress-bar"></div>
            </div>
          </div>

          <div class="question-card">
            <p id="question-label">Q1</p>
            <h2 id="question-title"></h2>
          </div>

          <div id="answer-list" class="answer-list"></div>

          <button id="back-button" class="back-button" type="button">이전으로 가기</button>
        </section>

        <section id="result-view" class="hidden" aria-live="polite">
          <article class="result-card">
            <div class="result-visual" aria-hidden="true">
              <span id="result-icon" class="result-icon"></span>
            </div>

            <p class="result-label">최종 결과</p>
            <h2 id="main-result"></h2>
            <div id="result-quote" class="speech-bubble result-quote"></div>
            <div id="main-description" class="result-story"></div>
            <div id="result-details" class="result-details"></div>
            <figure id="result-picture-wrap" class="result-picture-wrap hidden">
              <img id="result-picture" class="result-picture" alt="" />
              <figcaption id="result-picture-caption"></figcaption>
            </figure>
          </article>

          <button id="restart-button" class="restart-button" type="button">다시 하기</button>
        </section>
      </section>
    </main>

    <script src="script.js?v=20260817-3"></script>
  </body>
</html>
